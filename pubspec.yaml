name: companion
description: One local Android app for books, manga, film and anime. Four separate libraries.
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.5
  file_picker: ^8.0.0
  image_picker: ^1.1.1
  intl: ^0.19.0
  uuid: ^4.4.0
  archive: ^4.5.2
  crypto: ^3.0.8
  image: ^4.12.0
  local_auth: ^3.0.2
  dynamic_color: ^1.9.0
  diacritic: ^0.1.6
  csv: ^8.0.0
  pdf: ^3.13.1
  path: ^1.9.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  file_selector: ^1.1.0
  xml: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
  fonts:
    - family: PlexSerif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSerif-SemiBold.ttf
          weight: 600
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Marquee
      fonts:
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
    - family: Grotesk
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
    - family: Readout
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
